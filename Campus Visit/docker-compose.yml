services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: visitor_system
      POSTGRES_USER: visitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-visitor}
    ports:
      - "5432:5432"
    volumes:
      - visitor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitor -d visitor_system"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./admin.properties:/app/admin.properties:ro
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/visitor_system
      DB_USER: visitor
      DB_PASSWORD: ${DB_PASSWORD:-visitor}
      VISITOR_ADMIN_USER: ${VISITOR_ADMIN_USER:-admin}
      VISITOR_ADMIN_PASSWORD: ${VISITOR_ADMIN_PASSWORD:-}

volumes:
  visitor_postgres_data:
