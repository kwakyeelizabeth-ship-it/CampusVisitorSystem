<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Success</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #2e7d32; }
        p { font-size: 16px; color: #333; }
        a { text-decoration: none; background: #003366; color: white; padding: 10px 20px; border-radius: 4px; display: inline-block; margin-top: 20px; }
        a:hover { background: #002244; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Visitor Successfully Registered!</h2>
        <p>Generated Visitor ID: <strong id="visitorId">[[VISITOR_ID]]</strong></p>
        <p>Name: <strong id="fullName">[[FULL_NAME]]</strong></p>
        <a href="/">Register Another Visitor</a>
    </div>
</body>
</html>
