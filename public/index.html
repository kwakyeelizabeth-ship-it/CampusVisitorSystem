<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Visitor Registration - Palm University</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: hsl(120, 100%, 15%); text-align: center; margin-bottom: 5px; }
        h3 { text-align: center; color: #555; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 12px; color: #333; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #1b4d22; color: white; padding: 10px; border: none; width: 100%; margin-top: 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #123317; }
    </style>
</head>
<body>
    <div class="container">
        <img src="PUC_Logo.png" alt="Palm University Logo" style="display: block; margin: 0 auto 20px; width: 100px;">
        <h2>Palm University</h2>
        <h3>Visitor Registration</h3>
        <form action="/register" method="POST">
            <label>Full Name:</label>
            <input type="text" name="fullName" pattern="[\p{L}]+(?: +[\p{L}]+)*" title="Use only letters and spaces." required>
            
            <label>Phone Number:</label>
            <input type="tel" name="phone" pattern="\+?[0-9](?:[0-9 ()-]*[0-9])?" title="Use 7 to 15 digits; spaces, hyphens, parentheses, and a leading + are allowed." required>
            
            <label>Purpose of Visit:</label>
            <input type="text" name="purpose" required>
            
            <label>Person to Visit (Host):</label>
            <input type="text" name="hostName" required>
            
            <button type="submit">Check In Visitor</button>
        </form>
    </div>
</body>
</html>
